version: '3.8'

services:
  db:
    image: postgres:15
    container_name: unqlassroom_db
    environment:
      POSTGRES_DB: unqlassroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - unq-net

  app:
    build: .
    container_name: unqlassroom_app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./unqlassroom.private-key.pem:/app/unqlassroom.private-key.pem:ro
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/unqlassroom
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - unq-net

volumes:
  pgdata:

networks:
  unq-net:
    driver: bridge