spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.application.name=unqlassroom

# GitHub App authentication
github.app.app-id=${GITHUB_APP_ID:}
github.app.installation-id=${GITHUB_INSTALLATION_ID:}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:./unqlassroom.private-key.pem}
github.app.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/unqlassroom
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true