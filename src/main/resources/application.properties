spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.application.name=unqlassroom

# GitHub App authentication
github.app.app-id=${GITHUB_APP_ID:}
github.app.installation-id=${GITHUB_INSTALLATION_ID:}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:./unqlassroom.private-key.pem}
github.app.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.app.organization=${GITHUB_ORGANIZATION:}

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/unqlassroom
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
unqlassroom.jwt.secret=${JWT_SECRET}
unqlassroom.jwt.expiration=${JWT_EXPIRATION_MS}

# GitHub OAuth
github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.token-url=${GITHUB_OAUTH_TOKEN_URL:https://github.com/login/oauth/access_token}
github.oauth.user-url=${GITHUB_OAUTH_USER_URL:https://api.github.com/user}